# Written by the sMap SDK's release workflow (its tools/release/releases-repo); edit it there.
#
# The release workflow of the sMap SDK pushes the release's commit to main and then its XCFrameworks to the branch
# upload/<version> (with release.json: the version and the main commit). This turns that branch into the GitHub
# Release <version> on that commit (creating the tag the Swift package is resolved by), with the XCFrameworks as
# its assets, and deletes the branch.
name: publish release

on:
  push:
    branches: ['upload/**']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(jq -r .version release.json)
          target=$(jq -r .target release.json)
          [ "upload/$version" = "$GITHUB_REF_NAME" ] || { echo "branch $GITHUB_REF_NAME does not match $version"; exit 1; }
          if gh release view "$version" >/dev/null 2>&1; then
            gh release upload "$version" *.xcframework.zip --clobber
          else
            gh release create "$version" *.xcframework.zip --target "$target" --title "sMap $version" \
              --notes "sMap $version for iOS, macOS and Android. Documentation: https://open.superroute.ca/developer/smap"
          fi
      - name: Delete the upload branch
        run: git push origin --delete "$GITHUB_REF_NAME"
